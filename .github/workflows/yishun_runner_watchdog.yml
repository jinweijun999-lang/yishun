name: YiShun Runner Availability Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  runner-watchdog:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_RUNNER_LABELS: self-hosted,Linux,X64,yishun-prod
      MAX_QUEUED_MINUTES: "10"
      WAITING_RUN_STATUSES: queued,pending,waiting,requested
      WATCHED_WORKFLOWS: Next.js CI/CD,YiShun Daily Ops Export
      YISHUN_PRODUCTION_BASE_URL: https://11263.com
      CODEX_BRIDGE_OUTBOX: ${{ runner.temp }}/yishun-release-lag-outbox
      YISHUN_RELEASE_LAG_EVIDENCE_DIR: ${{ runner.temp }}/yishun-release-lag-evidence
      YISHUN_OPS_REPORT_FALLBACK_DIR: ${{ runner.temp }}/yishun-release-lag-fallback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Check YiShun release lag and waiting operations
        env:
          GH_TOKEN: ${{ github.token }}
          YISHUN_GITHUB_REPO: ${{ github.repository }}
          YISHUN_MAX_QUEUED_MINUTES: ${{ env.MAX_QUEUED_MINUTES }}
          YISHUN_WATCHED_WORKFLOWS: ${{ env.WATCHED_WORKFLOWS }}
        run: node scripts/yishun-release-lag-watch.mjs --fail-on-blocker

      - name: Upload release lag evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yishun-release-lag-watch
          path: |
            ${{ env.CODEX_BRIDGE_OUTBOX }}
            ${{ env.YISHUN_RELEASE_LAG_EVIDENCE_DIR }}
            ${{ env.YISHUN_OPS_REPORT_FALLBACK_DIR }}
          if-no-files-found: warn
          retention-days: 14
