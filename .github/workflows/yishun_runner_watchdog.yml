name: YiShun Runner Availability Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  runner-watchdog:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_RUNNER_LABELS: self-hosted,Linux,X64,yishun-prod
      MAX_QUEUED_MINUTES: "10"
      WAITING_RUN_STATUSES: queued,pending,waiting,requested
      WATCHED_WORKFLOWS: Next.js CI/CD,YiShun Daily Ops Export

    steps:
      - name: Check YiShun runner and waiting operations
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const labels = process.env.REQUIRED_RUNNER_LABELS
              .split(",")
              .map((label) => label.trim())
              .filter(Boolean);
            const watchedWorkflows = process.env.WATCHED_WORKFLOWS
              .split(",")
              .map((name) => name.trim())
              .filter(Boolean);
            const waitingStatuses = process.env.WAITING_RUN_STATUSES
              .split(",")
              .map((status) => status.trim())
              .filter(Boolean);
            const maxQueuedMinutes = Number(process.env.MAX_QUEUED_MINUTES || "10");
            const { owner, repo } = context.repo;

            const waitingRunPages = await Promise.all(waitingStatuses.map((status) =>
              github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                status,
                per_page: 100,
              })
                .then((runs) => runs.map((run) => ({ ...run, watchdog_status: status })))
            ));
            const waitingRunsById = new Map();
            for (const run of waitingRunPages.flat()) {
              waitingRunsById.set(run.id, run);
            }
            const waitingRuns = [...waitingRunsById.values()];
            const staleCutoffMs = Date.now() - maxQueuedMinutes * 60 * 1000;
            const staleWatchedRuns = waitingRuns.filter((run) => {
              if (!watchedWorkflows.includes(run.name)) return false;
              return new Date(run.created_at).getTime() < staleCutoffMs;
            });

            await core.summary
              .addHeading("YiShun Runner Availability Watchdog")
              .addTable([
                [{ data: "Check", header: true }, { data: "Value", header: true }],
                ["Expected self-hosted labels", labels.join(", ")],
                ["Direct runner API", "not used; GITHUB_TOKEN does not grant runner administration read"],
                ["Watched workflows", watchedWorkflows.join(", ")],
                ["Waiting statuses", waitingStatuses.join(", ")],
                ["Max queued minutes", String(maxQueuedMinutes)],
                ["Stale waiting watched runs", String(staleWatchedRuns.length)],
              ])
              .write();

            if (staleWatchedRuns.length > 0) {
              const details = staleWatchedRuns
                .map((run) => `${run.name} #${run.run_number} ${run.status} since ${run.created_at}: ${run.html_url}`)
                .join("; ");
              throw new Error(`YiShun watched workflow is waiting longer than ${maxQueuedMinutes} minutes. ${details}`);
            }

            core.info("YiShun runner watchdog passed: no watched workflow has waited past the threshold.");
