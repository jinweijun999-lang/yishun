name: YiShun Runner Availability Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  runner-watchdog:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_QUEUED_MINUTES: "10"
      WATCHED_WORKFLOWS: Next.js CI/CD,YiShun Daily Ops Export

    steps:
      - name: Check YiShun runner and queued operations
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const watchedWorkflows = process.env.WATCHED_WORKFLOWS
              .split(",")
              .map((name) => name.trim())
              .filter(Boolean);
            const maxQueuedMinutes = Number(process.env.MAX_QUEUED_MINUTES || "10");
            const { owner, repo } = context.repo;

            // GITHUB_TOKEN cannot read the self-hosted runner inventory because
            // that endpoint requires repository administration permissions.
            // Detect runner outages from stale queued workflows instead.
            const queuedRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status: "queued",
              per_page: 100,
            });
            const staleCutoffMs = Date.now() - maxQueuedMinutes * 60 * 1000;
            const staleWatchedRuns = queuedRuns.filter((run) => {
              if (!watchedWorkflows.includes(run.name)) return false;
              return new Date(run.created_at).getTime() < staleCutoffMs;
            });

            await core.summary
              .addHeading("YiShun Runner Availability Watchdog")
              .addTable([
                [{ data: "Check", header: true }, { data: "Value", header: true }],
                ["Runner inventory", "not available to GITHUB_TOKEN; inferred from queued workflows"],
                ["Watched workflows", watchedWorkflows.join(", ")],
                ["Max queued minutes", String(maxQueuedMinutes)],
                ["Stale queued watched runs", String(staleWatchedRuns.length)],
              ])
              .write();

            if (staleWatchedRuns.length > 0) {
              const details = staleWatchedRuns
                .map((run) => `${run.name} #${run.run_number} queued since ${run.created_at}: ${run.html_url}`)
                .join("; ");
              throw new Error(`YiShun watched workflow is queued longer than ${maxQueuedMinutes} minutes. ${details}`);
            }

            core.info("YiShun runner queue watchdog passed; no watched workflow is stale in queued state.");
