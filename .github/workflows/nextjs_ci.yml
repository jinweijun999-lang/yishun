name: Next.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextjs-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yishun_ci?schema=public
      AUTH_SECRET: ci-build-secret
      GOOGLE_API_KEY: placeholder-for-ci
      ZHIPU_API_KEY: placeholder-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yishun-nextjs-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.js
            prisma
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7


  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.YISHUN_SSH_KEY }}" > ~/.ssh/yishun_deploy_key
          chmod 600 ~/.ssh/yishun_deploy_key
          printf '%s\n' "${{ secrets.YISHUN_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run server deploy script
        run: |
          ssh -i ~/.ssh/yishun_deploy_key \
            -p "${{ secrets.YISHUN_SSH_PORT }}" \
            -o BatchMode=yes \
            "${{ secrets.YISHUN_SSH_USER }}@${{ secrets.YISHUN_SSH_HOST }}" \
            'sudo -n -u yishun /home/yishun/deploy.sh'

      - name: Verify production health
        run: |
          ssh -i ~/.ssh/yishun_deploy_key \
            -p "${{ secrets.YISHUN_SSH_PORT }}" \
            -o BatchMode=yes \
            "${{ secrets.YISHUN_SSH_USER }}@${{ secrets.YISHUN_SSH_HOST }}" \
            'set -e; for i in $(seq 1 30); do curl -fsS --max-time 10 http://127.0.0.1:3001/ >/dev/null && curl -fsS --max-time 10 http://127.0.0.1:3001/api/kanban/status >/dev/null && sudo -n -u yishun pm2 describe yishun-nextjs >/dev/null && exit 0; echo "waiting for app health attempt=$i"; sleep 2; done; sudo -n -u yishun pm2 logs yishun-nextjs --lines 80 --nostream; exit 1'
