name: Next.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextjs-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yishun_ci?schema=public
      AUTH_SECRET: ci-build-secret
      GOOGLE_API_KEY: placeholder-for-ci
      ZHIPU_API_KEY: placeholder-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yishun-nextjs-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.js
            prisma
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7


  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, Linux, X64, yishun-prod]
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy locally with Prisma migrations
        run: |
          sudo -n -u yishun bash -lc '
            set -euo pipefail
            cd /home/yishun/yishun
            echo ">>> [1/7] Syncing latest main..."
            git fetch origin main
            git reset --hard origin/main
            echo ">>> [2/7] Installing dependencies..."
            npm ci
            echo ">>> [3/7] Generating Prisma client..."
            npx prisma generate
            echo ">>> [4/7] Applying Prisma migrations before restart..."
            npx prisma migrate deploy
            echo ">>> [5/7] Building application..."
            npm run build
            echo ">>> [6/7] Restarting PM2..."
            pm2 restart yishun-nextjs --update-env
            echo ">>> [7/7] Saving PM2 state..."
            pm2 save
          '

      - name: Verify production health locally
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:3001/ >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1:3001/api/kanban/status >/dev/null \
              && sudo -n -u yishun pm2 describe yishun-nextjs >/dev/null; then
              exit 0
            fi
            echo "waiting for app health attempt=$i"
            sleep 2
          done
          sudo -n -u yishun pm2 logs yishun-nextjs --lines 80 --nostream
          exit 1
