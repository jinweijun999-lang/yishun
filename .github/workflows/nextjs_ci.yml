name: Next.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextjs-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-build-secret
      GOOGLE_API_KEY: placeholder-for-ci
      ZHIPU_API_KEY: placeholder-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yishun-nextjs-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.js
            prisma
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
