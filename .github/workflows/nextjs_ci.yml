name: Next.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nextjs-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yishun_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yishun_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yishun_ci?schema=public
      AUTH_SECRET: ci-build-secret
      GOOGLE_API_KEY: placeholder-for-ci
      ZHIPU_API_KEY: placeholder-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply CI database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Consumer copy smoke
        run: npm run smoke:consumer-copy

      - name: Production config audit
        run: npm run audit:production-config

      - name: Analytics contract audit
        run: npm run audit:analytics-contract

      - name: Daily data report dry run
        run: |
          YISHUN_REPORT_NO_NETWORK=1 \
          YISHUN_DAILY_REPORT_DIR="${RUNNER_TEMP:-/tmp}/yishun-daily-report-ci" \
          node scripts/yishun-daily-data-report.mjs

      - name: Monitoring contract audit
        run: npm run audit:monitoring-contract

      - name: Growth ops contract audit
        run: npm run audit:growth-ops

      - name: Stripe payment contract audit
        run: npm run audit:stripe-contract

      - name: Payment entitlement smoke
        run: npm run smoke:p0-payment-entitlement

      - name: Stripe webhook entitlement smoke
        run: npm run smoke:stripe-webhook

      - name: Stripe secret literal check
        run: node scripts/stripe-sandbox-secret-check.mjs

      - name: Foundation smoke
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yishun-nextjs-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.js
            prisma
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7


  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, Linux, X64, yishun-prod]
    timeout-minutes: 20
    needs: build
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.event_name == 'workflow_dispatch'
    env:
      GEMINI_API_KEY_YISHUN: ${{ secrets.GEMINI_API_KEY_YISHUN }}
      YISHUN_RELEASE_SHA: 368695579083a58325f020c6e37a8d9261307360
      YISHUN_GEMINI_SERVER_ENABLED: "1"
      YISHUN_GEMINI_DAILY_LIMIT: "100"
      YISHUN_GEMINI_SAMPLE_RATE: "0.25"
      YISHUN_GEMINI_MAX_OUTPUT_TOKENS: "900"
      YISHUN_GEMINI_TIMEOUT_MS: "12000"
      YISHUN_GEMINI_CACHE_TTL_MS: "86400000"
      YISHUN_ANALYTICS_FILE: "/home/yishun/logs/yishun-analytics.jsonl"

    steps:
      - name: Deploy locally with Prisma migrations
        run: |
          if [ -z "${GEMINI_API_KEY_YISHUN:-}" ]; then
            echo "GEMINI_API_KEY_YISHUN secret is missing"
            exit 1
          fi
          sudo -n -u yishun env \
            GEMINI_API_KEY_YISHUN="$GEMINI_API_KEY_YISHUN" \
            YISHUN_RELEASE_SHA="$YISHUN_RELEASE_SHA" \
            YISHUN_GEMINI_SERVER_ENABLED="$YISHUN_GEMINI_SERVER_ENABLED" \
            YISHUN_GEMINI_DAILY_LIMIT="$YISHUN_GEMINI_DAILY_LIMIT" \
            YISHUN_GEMINI_SAMPLE_RATE="$YISHUN_GEMINI_SAMPLE_RATE" \
            YISHUN_GEMINI_MAX_OUTPUT_TOKENS="$YISHUN_GEMINI_MAX_OUTPUT_TOKENS" \
            YISHUN_GEMINI_TIMEOUT_MS="$YISHUN_GEMINI_TIMEOUT_MS" \
            YISHUN_GEMINI_CACHE_TTL_MS="$YISHUN_GEMINI_CACHE_TTL_MS" \
            YISHUN_ANALYTICS_FILE="$YISHUN_ANALYTICS_FILE" \
            bash -lc '
            set -euo pipefail
            cd /home/yishun/yishun
            echo ">>> [1/7] Syncing latest main..."
            git fetch origin main
            git reset --hard origin/main
            for env_file in .env .env.production .env.local; do
              if [ -f "$env_file" ]; then
                echo "Loading runtime environment from $env_file"
                set -a
                . "$env_file"
                set +a
              fi
            done
            export GEMINI_API_KEY_YISHUN="$GEMINI_API_KEY_YISHUN"
            export YISHUN_RELEASE_SHA="$YISHUN_RELEASE_SHA"
            export YISHUN_GEMINI_SERVER_ENABLED="$YISHUN_GEMINI_SERVER_ENABLED"
            export YISHUN_GEMINI_DAILY_LIMIT="$YISHUN_GEMINI_DAILY_LIMIT"
            export YISHUN_GEMINI_SAMPLE_RATE="$YISHUN_GEMINI_SAMPLE_RATE"
            export YISHUN_GEMINI_MAX_OUTPUT_TOKENS="$YISHUN_GEMINI_MAX_OUTPUT_TOKENS"
            export YISHUN_GEMINI_TIMEOUT_MS="$YISHUN_GEMINI_TIMEOUT_MS"
            export YISHUN_GEMINI_CACHE_TTL_MS="$YISHUN_GEMINI_CACHE_TTL_MS"
            export YISHUN_ANALYTICS_FILE="$YISHUN_ANALYTICS_FILE"
            printf "%s\n" "$YISHUN_RELEASE_SHA" > .yishun-release-sha
            echo ">>> [2/7] Installing dependencies..."
            npm ci
            echo ">>> [3/7] Generating Prisma client..."
            npx prisma generate
            echo ">>> [4/7] Applying Prisma migrations before restart..."
            npx prisma migrate deploy
            echo ">>> [5/7] Building application..."
            npm run build
            echo ">>> [6/7] Restarting PM2 with Gemini cost guard env..."
            mkdir -p "$(dirname "$YISHUN_ANALYTICS_FILE")"
            pm2 restart yishun-nextjs --update-env
            echo ">>> [7/7] Saving PM2 state..."
            pm2 save
          '

      - name: Verify production health locally
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:3001/ >/dev/null \
              && health_payload=$(curl -fsS --max-time 10 http://127.0.0.1:3001/api/health) \
              && node -e 'const r=JSON.parse(process.argv[1]); if (r.ok !== true) throw new Error("health ok was not true"); if (r.version !== process.env.YISHUN_RELEASE_SHA) throw new Error(`health version ${r.version} did not match ${process.env.YISHUN_RELEASE_SHA}`);' "$health_payload" \
              && sudo -n -u yishun pm2 describe yishun-nextjs >/dev/null; then
              exit 0
            fi
            echo "waiting for app health attempt=$i"
            sleep 2
          done
          sudo -n -u yishun pm2 logs yishun-nextjs --lines 80 --nostream
          exit 1

      - name: Verify production analytics file sink locally
        run: |
          set -euo pipefail
          probe_id="gha_file_sink_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(date +%s)"
          payload=$(node -e '
            const probeId = process.argv[1];
            process.stdout.write(JSON.stringify({
              event: "ops_analytics_file_sink_probe",
              anonymous_id: `ops_${probeId}`,
              source: "github_actions_deploy",
              ts: new Date().toISOString(),
              properties: {
                product_id: "yishun",
                anonymous_id: `ops_${probeId}`,
                session_id: probeId,
                utm_source: "github_actions",
                utm_medium: "deploy",
                utm_campaign: "analytics_file_sink_verification",
                country: "unknown",
                locale: "ops",
                device: "server",
                page: "/ops/analytics-file-sink",
                variant: "ops",
                probe_id: probeId,
                release_version: process.env.YISHUN_RELEASE_SHA
              }
            }));
          ' "$probe_id")
          response=$(curl -fsS --max-time 10 -X POST http://127.0.0.1:3001/api/events \
            -H 'content-type: application/json' \
            --data "$payload")
          node -e 'const r=JSON.parse(process.argv[1]); if (r.ok !== true || r.accepted !== 1) throw new Error(`analytics ingest did not accept file sink probe: ${process.argv[1]}`);' "$response"

          for i in $(seq 1 10); do
            if sudo -n -u yishun test -f "$YISHUN_ANALYTICS_FILE" \
              && sudo -n -u yishun grep -F "$probe_id" "$YISHUN_ANALYTICS_FILE" >/dev/null; then
              echo "analytics file sink verified: ${YISHUN_ANALYTICS_FILE}"
              exit 0
            fi
            echo "waiting for analytics file sink attempt=$i"
            sleep 1
          done

          echo "analytics file sink probe was accepted but not found in ${YISHUN_ANALYTICS_FILE}"
          sudo -n -u yishun ls -l "$(dirname "$YISHUN_ANALYTICS_FILE")" || true
          exit 1

      - name: Smoke share landing API locally
        run: |
          set -euo pipefail
          payload='{"anonymous_id":"ci-smoke","source_screen":"daily_card","card_type":"daily_luck","template_id":"mystic","locale":"en-US","payload":{"title":"CI Smoke Timing Card","theme":"Daily timing","summary":"A safe public share-card smoke test.","best_window":"09:00-11:00","action":"Open YiShun and create your own timing card."},"utm":{"source":"github_actions","medium":"ci","campaign":"share_landing_smoke"}}'
          response=$(curl -fsS --max-time 10 -X POST http://127.0.0.1:3001/api/v1/shares \
            -H 'content-type: application/json' \
            --data "$payload")
          share_id=$(node -e 'const r=JSON.parse(process.argv[1]); if (!r.share_id || !r.share_url) process.exit(1); console.log(r.share_id)' "$response")
          curl -fsS --max-time 10 "http://127.0.0.1:3001/api/v1/shares/${share_id}" \
            | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const r=JSON.parse(s); if(r.share_id!==process.argv[1] || !r.public_payload?.title) process.exit(1);})' "$share_id"
          curl -fsS --max-time 10 -X POST "http://127.0.0.1:3001/api/v1/shares/${share_id}/cta" \
            | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const r=JSON.parse(s); if(r.ok!==true) process.exit(1);})'
          curl -fsS --max-time 10 "http://127.0.0.1:3001/s/${share_id}" >/dev/null
          echo "share landing smoke passed: ${share_id}"

      - name: Verify public production health version
        run: |
          set -euo pipefail
          health_payload=$(curl -fsS --max-time 15 https://11263.com/api/health)
          node -e '
            const r = JSON.parse(process.argv[1]);
            if (r.ok !== true) throw new Error("public health ok was not true");
            if (r.service !== "yishun") throw new Error(`unexpected service ${r.service}`);
            if (r.version !== process.env.YISHUN_RELEASE_SHA) throw new Error(`public health version ${r.version} did not match ${process.env.YISHUN_RELEASE_SHA}`);
            for (const key of ["database", "stripe", "analytics"]) {
              if (r.checks?.[key] !== "ok" && r.checks?.[key] !== "configured") throw new Error(`public health ${key} check was ${r.checks?.[key]}`);
            }
            console.log(`public health release verified: ${r.version}`);
          ' "$health_payload"
      - name: Smoke Bazi preview access boundary locally
        run: |
          set -euo pipefail
          payload='{"birthDate":"1990-01-01","birthTime":"17:08","birthTimeKnown":true,"birthPlaceText":"Beijing, China","longitude":116.4,"latitude":39.9,"timezoneOffsetMinutes":-480,"timezoneName":"Asia/Shanghai","gender":"female","locale":"en","focus":"CI anonymous preview boundary","enableAi":true}'
          response=$(curl -fsS --max-time 20 -X POST http://127.0.0.1:3001/api/bazi/preview \
            -H 'content-type: application/json' \
            --data "$payload")
          node -e '
            const r=JSON.parse(process.argv[1]);
            if (r.access?.depth !== "free_teaser") throw new Error("expected anonymous free_teaser depth");
            if (!r.dailySignal?.score && !r.freeSummary?.score) throw new Error("expected daily/free score");
            if (r.ai?.status !== "locked" || r.ai?.reason !== "full_report_required") throw new Error("expected full_report_required lock");
            console.log("bazi preview access boundary smoke passed");
          ' "$response"
